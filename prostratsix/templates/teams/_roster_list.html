{% load i18n %}
<ul class="list-group mb-4">
  {% for membership in memberships %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <span>
        {{ membership.user }}
        <span class="badge bg-secondary ms-2">{{ membership.get_role_display }}</span>
      </span>
      {% if can_manage and membership.role != "owner" %}
        <span class="d-flex gap-2">
          {% if is_owner %}
            <form method="post"
                  action="{% url 'teams:transfer_ownership' team.slug membership.user.pk %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm">{% trans "Zum Owner machen" %}</button>
            </form>
          {% endif %}
          <form method="post"
                action="{% url 'teams:remove_member' team.slug membership.user.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">{% trans "Entfernen" %}</button>
          </form>
        </span>
      {% endif %}
    </li>
  {% endfor %}
</ul>
