{# djlint:off #}
{% autoescape off %}
  <h2>{{ notification.title }}</h2>
  <p>{{ notification.message }}</p>
  {% if notification.url %}
    <p>
      <a href="{{ notification.url }}"
         style="display:inline-block;padding:10px 20px;background:#0a0d13;color:#fff;text-decoration:none;border-radius:4px;">View</a>
    </p>
  {% endif %}
  <hr />
  <p style="color:#888;font-size:12px;">ProStratSix</p>
{% endautoescape %}
